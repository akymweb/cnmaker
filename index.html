<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Notes Maker</title>
    <style>
        /* Base Styles */
        body {
            font-family: 'Century Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            display: flex;
            height: 100vh;
        }

        /* Split Screen Layout */
        .sidebar {
            width: 350px;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 10;
        }

        .preview-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            overflow-y: auto;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: 'Century Gothic', sans-serif;
        }

        textarea {
            resize: vertical;
        }

        /* Buttons */
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Century Gothic', sans-serif;
        }

        button:hover {
            background-color: #0056b3;
        }

        .btn-remove {
            background-color: #dc3545;
            display: none; /* Hidden by default until a photo is uploaded */
        }

        .btn-remove:hover {
            background-color: #c82333;
        }

        /* A4 Page Layout */
        .a4-page {
            width: 210mm;
            min-height: 297mm; /* Standard A4 Size */
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            box-sizing: border-box;
            position: relative;
            
            /* BORDER LOGIC */
            border: 20mm solid transparent; /* Creates the space for the border image */
            padding: 10mm; /* Gives the text breathing room from the border */
            
            /* Layer 1 (Top): Solid white center. Layer 2 (Bottom): Uploaded theme */
            background-image: linear-gradient(white, white), var(--theme-bg, none);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
            
            /* SMART RENDERING: 'cover' keeps aspect ratio, 'center' prevents awkward cropping */
            background-size: auto, cover; 
            background-position: center, center; 
            background-repeat: no-repeat;
            
            /* Fallback color if no image is loaded */
            background-color: white; 
        }

        .header-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .header-grid p {
            margin: 5px 0;
            font-size: 14px;
        }

        .content-body {
            text-align: justify;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Print Settings */
        @media print {
            body {
                background-color: white;
                display: block;
            }
            .sidebar {
                display: none;
            }
            .preview-area {
                padding: 0;
                display: block;
            }
            .a4-page {
                box-shadow: none;
                width: 210mm;
                height: 297mm;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                page-break-after: always;
            }
            @page {
                size: A4;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Concept Notes Maker</h2>
        
        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="inpName" placeholder="e.g. Myka L. Lascano">
        </div>

        <div class="form-group">
            <label>Grade and Section:</label>
            <input type="text" id="inpSection" placeholder="e.g. 12 STEM 1A">
        </div>

        <div class="form-group">
            <label>Teacher:</label>
            <input type="text" id="inpTeacher" placeholder="e.g. Ms. Myka L. Lascano">
        </div>

        <div class="form-group">
            <label>Concept Notes Number:</label>
            <input type="text" id="inpNumber" placeholder="e.g. 01">
        </div>

        <div class="form-group">
            <label>Content:</label>
            <textarea id="inpContent" rows="12" placeholder="Type your notes here..."></textarea>
        </div>

        <div class="form-group">
            <label>Theme (Border Image):</label>
            <input type="file" id="inpTheme" accept="image/*">
            <button id="btnRemove" class="btn-remove" type="button">Remove Photo</button>
            <small style="color:#666; display:block; margin-top:5px;">Upload a full photo. The app will smartly crop it to fit as a border without stretching.</small>
        </div>

        <button onclick="window.print()">Save as PDF / Print</button>
    </div>

    <div class="preview-area">
        <div class="a4-page" id="pagePreview">
            
            <div class="header-grid">
                <div>
                    <p><strong>Name:</strong> <span id="outName"></span></p>
                    <p><strong>Grade & Section:</strong> <span id="outSection"></span></p>
                </div>
                <div>
                    <p><strong>Teacher:</strong> <span id="outTeacher"></span></p>
                    <p><strong>CN Number:</strong> <span id="outNumber"></span></p>
                </div>
            </div>

            <div class="content-body" id="outContent"></div>

        </div>
    </div>

    <script>
        // Update Text Fields in Real Time
        const bindInput = (inputId, outputId) => {
            document.getElementById(inputId).addEventListener('input', function(e) {
                document.getElementById(outputId).textContent = e.target.value;
            });
        };

        bindInput('inpName', 'outName');
        bindInput('inpSection', 'outSection');
        bindInput('inpTeacher', 'outTeacher');
        bindInput('inpNumber', 'outNumber');
        bindInput('inpContent', 'outContent');

        // Handle Image Upload (Smart & Fast for Large Files)
        const inpTheme = document.getElementById('inpTheme');
        const btnRemove = document.getElementById('btnRemove');
        const pagePreview = document.getElementById('pagePreview');
        let currentImageUrl = null;

        inpTheme.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // Clear old memory if an image was already uploaded
                if (currentImageUrl) {
                    URL.revokeObjectURL(currentImageUrl);
                }
                
                // Create a fast local URL for the image (Supports very large MB sizes)
                currentImageUrl = URL.createObjectURL(file);
                
                // Apply to the border
                pagePreview.style.setProperty('--theme-bg', `url('${currentImageUrl}')`);
                
                // Show the remove button
                btnRemove.style.display = 'block';
            }
        });

        // Handle Remove Photo Button
        btnRemove.addEventListener('click', function() {
            // Reset input file
            inpTheme.value = '';
            
            // Remove CSS variable
            pagePreview.style.removeProperty('--theme-bg');
            
            // Hide button
            btnRemove.style.display = 'none';
            
            // Free up browser memory
            if (currentImageUrl) {
                URL.revokeObjectURL(currentImageUrl);
                currentImageUrl = null;
            }
        });
    </script>
</body>
</html>
