<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Notes Maker</title>
    <style>
        /* Base Styles */
        body {
            font-family: 'Century Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            display: flex;
            height: 100vh;
        }

        /* Split Screen Layout */
        .sidebar {
            width: 350px;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 10;
        }

        .preview-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            overflow-y: auto;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: 'Century Gothic', sans-serif;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Century Gothic', sans-serif;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* A4 Page Layout */
        .a4-page {
            width: 210mm;
            min-height: 297mm; /* Standard A4 Size */
            background-color: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            box-sizing: border-box;
            position: relative;
            background-size: 100% 100%; /* For the uploaded theme border */
            background-position: center;
            background-repeat: no-repeat;
            
            /* Inner padding to keep text away from the border theme */
            padding: 30mm; 
        }

        .header-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .header-grid p {
            margin: 5px 0;
            font-size: 14px;
        }

        .content-body {
            text-align: justify; /* Justify requirement */
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap; /* Keeps paragraphs intact */
        }

        /* Print Settings */
        @media print {
            body {
                background-color: white;
                display: block;
            }
            .sidebar {
                display: none; /* Hide controls when printing */
            }
            .preview-area {
                padding: 0;
                display: block;
            }
            .a4-page {
                box-shadow: none;
                width: 210mm;
                height: 297mm;
                padding: 20mm; /* Adjust padding for physical print */
                page-break-after: always;
            }
            @page {
                size: A4;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Concept Notes Maker</h2>
        
        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="inpName" placeholder="e.g. Juan Dela Cruz">
        </div>

        <div class="form-group">
            <label>Grade and Section:</label>
            <input type="text" id="inpSection" placeholder="e.g. 12 - STEM A">
        </div>

        <div class="form-group">
            <label>Teacher:</label>
            <input type="text" id="inpTeacher" placeholder="e.g. Mr. Smith">
        </div>

        <div class="form-group">
            <label>Concept Notes Number:</label>
            <input type="text" id="inpNumber" placeholder="e.g. 01">
        </div>

        <div class="form-group">
            <label>Content:</label>
            <textarea id="inpContent" rows="12" placeholder="Type your notes here..."></textarea>
        </div>

        <div class="form-group">
            <label>Theme (Border Image):</label>
            <input type="file" id="inpTheme" accept="image/*">
            <small style="color:#666;">Upload an image frame/border. Transparent PNGs work best.</small>
        </div>

        <button onclick="window.print()">Save as PDF / Print</button>
    </div>

    <div class="preview-area">
        <div class="a4-page" id="pagePreview">
            
            <div class="header-grid">
                <div>
                    <p><strong>Name:</strong> <span id="outName"></span></p>
                    <p><strong>Grade & Section:</strong> <span id="outSection"></span></p>
                </div>
                <div>
                    <p><strong>Teacher:</strong> <span id="outTeacher"></span></p>
                    <p><strong>CN Number:</strong> <span id="outNumber"></span></p>
                </div>
            </div>

            <div class="content-body" id="outContent"></div>

        </div>
    </div>

    <script>
        // Update Text Fields in Real Time
        const bindInput = (inputId, outputId) => {
            document.getElementById(inputId).addEventListener('input', function(e) {
                document.getElementById(outputId).textContent = e.target.value;
            });
        };

        bindInput('inpName', 'outName');
        bindInput('inpSection', 'outSection');
        bindInput('inpTeacher', 'outTeacher');
        bindInput('inpNumber', 'outNumber');
        bindInput('inpContent', 'outContent');

        // Handle Image Upload for the Theme (Border)
        document.getElementById('inpTheme').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const page = document.getElementById('pagePreview');
                    // Set the uploaded image as the background of the A4 page
                    page.style.backgroundImage = `url('${event.target.result}')`;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
